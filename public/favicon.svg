<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Stripe Indigo squircle container -->
  <rect width="64" height="64" rx="16" fill="#635BFF"/>
  
  <!-- Outer Ring: Vitality Ruby -->
  <circle cx="32" cy="32" r="23" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="115 30" transform="rotate(-90 32 32)"/>
  
  <!-- Middle Ring: Intellect Emerald -->
  <circle cx="32" cy="32" r="16.5" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="80 24" transform="rotate(30 32 32)"/>
  
  <!-- Inner Ring: Discipline Sapphire -->
  <circle cx="32" cy="32" r="10" stroke="#60A5FA" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="45 18" transform="rotate(-140 32 32)"/>
  
  <!-- Center Quest Bolt in Pure White -->
  <polygon points="33 22 27 32 31.5 32 30.5 42 37 31 32.5 31 33 22" fill="#FFFFFF"/>
</svg>
